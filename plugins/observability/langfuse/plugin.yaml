manifest_version: 1
name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for STOA — traces conversations, LLM calls, and tool usage. Opt-in via `stoa plugins enable observability/langfuse` (or check the box in `stoa plugins`)."
author: stoa-xyz
requires_env:
  - STOA_LANGFUSE_PUBLIC_KEY
  - STOA_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
