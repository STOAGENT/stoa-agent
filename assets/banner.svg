<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#d99a2b"/>
      <stop offset="100%" stop-color="#a05a08"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#ink)"/>

  <!-- subtle pixel-grid backdrop -->
  <g fill="#3a2510" opacity="0.18">
    <rect x="0"  y="0"  width="1200" height="2"/>
    <rect x="0"  y="318" width="1200" height="2"/>
    <rect x="0"  y="0"  width="2" height="320"/>
    <rect x="1198" y="0" width="2" height="320"/>
  </g>

  <!-- wordmark: STOA · AGENT in chunky retro -->
  <g filter="url(#glow)" font-family="Impact, 'Arial Black', 'Helvetica Neue Black', sans-serif" font-weight="900" text-anchor="middle">
    <text x="600" y="195" font-size="170" fill="url(#gold)" letter-spacing="14">STOA-AGENT</text>
  </g>

  <!-- amber rule underline -->
  <rect x="200" y="235" width="800" height="3" fill="#a78b56" opacity="0.8"/>

  <!-- six-dot council marker — six sovereign LLMs -->
  <g fill="#d99a2b" opacity="0.85">
    <circle cx="450" cy="265" r="6"/>
    <circle cx="510" cy="265" r="6"/>
    <circle cx="570" cy="265" r="6"/>
    <circle cx="630" cy="265" r="6"/>
    <circle cx="690" cy="265" r="6"/>
    <circle cx="750" cy="265" r="6"/>
  </g>

  <!-- subtitle / tagline strip -->
  <text x="600" y="297" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#9c815a" letter-spacing="6" text-anchor="middle">⁂  SIX  SOVEREIGN  LLMS  ·  ONE  AGENT  ·  ON-CHAIN  VERIFIABLE  ⁂</text>
</svg>
