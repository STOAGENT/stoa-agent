<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff1b6"/>
      <stop offset="30%" stop-color="#f5c84e"/>
      <stop offset="70%" stop-color="#c8841a"/>
      <stop offset="100%" stop-color="#5a2c00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0707"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pcb" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="url(#gold)"/>
      <rect y="2" width="6" height="1" fill="#5a2c00" opacity="0.55"/>
      <rect x="2" width="1" height="6" fill="#5a2c00" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Stroke + fill via group with filter — each glyph has thick outline + PCB inner fill.
       Layout: 10 glyphs, each 5×7 pixels at 16px = 80×112. Gap = 14. Total content =
       10*80 + 9*14 = 926. startX = (1200-926)/2 = 137. startY = (320-112)/2 - 8 = 96. -->

  <g filter="url(#glow)">
    <!-- Define the glyph fill as PCB pattern, the outline as thick dark stroke.
         Each "pixel" is a 16×16 rect with a 3px dark border on bottom+right and
         1px highlight on top+left — the recipe that gives the original its
         chunky 3D arcade look. -->

    <!-- We render each glyph as a SET of pixels. To keep the file readable, each
         glyph block below has its pixels listed in row,col order. The macro is:
         <rect x="originX+col*16" y="originY+row*16" width="16" height="16" fill="url(#pcb)"/>
         followed by edge shading rects.

         Glyph cells: 16px pixel size, 5 cols × 7 rows = 80×112 px per glyph.
    -->

    <!-- ────────  S — glyph 0, originX=137, originY=96 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: .XXXX -->
      <rect x="153" y="96"  width="16" height="16"/>
      <rect x="169" y="96"  width="16" height="16"/>
      <rect x="185" y="96"  width="16" height="16"/>
      <rect x="201" y="96"  width="16" height="16"/>
      <!-- row 1: X.... -->
      <rect x="137" y="112" width="16" height="16"/>
      <!-- row 2: X.... -->
      <rect x="137" y="128" width="16" height="16"/>
      <!-- row 3: .XXX. -->
      <rect x="153" y="144" width="16" height="16"/>
      <rect x="169" y="144" width="16" height="16"/>
      <rect x="185" y="144" width="16" height="16"/>
      <!-- row 4: ....X -->
      <rect x="201" y="160" width="16" height="16"/>
      <!-- row 5: ....X -->
      <rect x="201" y="176" width="16" height="16"/>
      <!-- row 6: XXXX. -->
      <rect x="137" y="192" width="16" height="16"/>
      <rect x="153" y="192" width="16" height="16"/>
      <rect x="169" y="192" width="16" height="16"/>
      <rect x="185" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  T — glyph 1, originX=231 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: XXXXX -->
      <rect x="231" y="96"  width="16" height="16"/>
      <rect x="247" y="96"  width="16" height="16"/>
      <rect x="263" y="96"  width="16" height="16"/>
      <rect x="279" y="96"  width="16" height="16"/>
      <rect x="295" y="96"  width="16" height="16"/>
      <!-- rows 1-6: ..X.. -->
      <rect x="263" y="112" width="16" height="16"/>
      <rect x="263" y="128" width="16" height="16"/>
      <rect x="263" y="144" width="16" height="16"/>
      <rect x="263" y="160" width="16" height="16"/>
      <rect x="263" y="176" width="16" height="16"/>
      <rect x="263" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  O — glyph 2, originX=325 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: .XXX. -->
      <rect x="341" y="96"  width="16" height="16"/>
      <rect x="357" y="96"  width="16" height="16"/>
      <rect x="373" y="96"  width="16" height="16"/>
      <!-- rows 1-5: X...X -->
      <rect x="325" y="112" width="16" height="16"/><rect x="389" y="112" width="16" height="16"/>
      <rect x="325" y="128" width="16" height="16"/><rect x="389" y="128" width="16" height="16"/>
      <rect x="325" y="144" width="16" height="16"/><rect x="389" y="144" width="16" height="16"/>
      <rect x="325" y="160" width="16" height="16"/><rect x="389" y="160" width="16" height="16"/>
      <rect x="325" y="176" width="16" height="16"/><rect x="389" y="176" width="16" height="16"/>
      <!-- row 6: .XXX. -->
      <rect x="341" y="192" width="16" height="16"/>
      <rect x="357" y="192" width="16" height="16"/>
      <rect x="373" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  A — glyph 3, originX=419 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: .XXX. -->
      <rect x="435" y="96"  width="16" height="16"/>
      <rect x="451" y="96"  width="16" height="16"/>
      <rect x="467" y="96"  width="16" height="16"/>
      <!-- rows 1-2: X...X -->
      <rect x="419" y="112" width="16" height="16"/><rect x="483" y="112" width="16" height="16"/>
      <rect x="419" y="128" width="16" height="16"/><rect x="483" y="128" width="16" height="16"/>
      <!-- row 3: XXXXX -->
      <rect x="419" y="144" width="16" height="16"/>
      <rect x="435" y="144" width="16" height="16"/>
      <rect x="451" y="144" width="16" height="16"/>
      <rect x="467" y="144" width="16" height="16"/>
      <rect x="483" y="144" width="16" height="16"/>
      <!-- rows 4-6: X...X -->
      <rect x="419" y="160" width="16" height="16"/><rect x="483" y="160" width="16" height="16"/>
      <rect x="419" y="176" width="16" height="16"/><rect x="483" y="176" width="16" height="16"/>
      <rect x="419" y="192" width="16" height="16"/><rect x="483" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  HYPHEN — glyph 4, originX=513 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 3 only: XXXXX -->
      <rect x="513" y="144" width="16" height="16"/>
      <rect x="529" y="144" width="16" height="16"/>
      <rect x="545" y="144" width="16" height="16"/>
      <rect x="561" y="144" width="16" height="16"/>
      <rect x="577" y="144" width="16" height="16"/>
    </g>

    <!-- ────────  A — glyph 5, originX=607 ──────── -->
    <g fill="url(#pcb)">
      <rect x="623" y="96"  width="16" height="16"/>
      <rect x="639" y="96"  width="16" height="16"/>
      <rect x="655" y="96"  width="16" height="16"/>
      <rect x="607" y="112" width="16" height="16"/><rect x="671" y="112" width="16" height="16"/>
      <rect x="607" y="128" width="16" height="16"/><rect x="671" y="128" width="16" height="16"/>
      <rect x="607" y="144" width="16" height="16"/>
      <rect x="623" y="144" width="16" height="16"/>
      <rect x="639" y="144" width="16" height="16"/>
      <rect x="655" y="144" width="16" height="16"/>
      <rect x="671" y="144" width="16" height="16"/>
      <rect x="607" y="160" width="16" height="16"/><rect x="671" y="160" width="16" height="16"/>
      <rect x="607" y="176" width="16" height="16"/><rect x="671" y="176" width="16" height="16"/>
      <rect x="607" y="192" width="16" height="16"/><rect x="671" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  G — glyph 6, originX=701 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: .XXX. -->
      <rect x="717" y="96"  width="16" height="16"/>
      <rect x="733" y="96"  width="16" height="16"/>
      <rect x="749" y="96"  width="16" height="16"/>
      <!-- rows 1-2: X.... -->
      <rect x="701" y="112" width="16" height="16"/>
      <rect x="701" y="128" width="16" height="16"/>
      <!-- row 3: X..XX -->
      <rect x="701" y="144" width="16" height="16"/>
      <rect x="749" y="144" width="16" height="16"/>
      <rect x="765" y="144" width="16" height="16"/>
      <!-- rows 4-5: X...X -->
      <rect x="701" y="160" width="16" height="16"/><rect x="765" y="160" width="16" height="16"/>
      <rect x="701" y="176" width="16" height="16"/><rect x="765" y="176" width="16" height="16"/>
      <!-- row 6: .XXX. -->
      <rect x="717" y="192" width="16" height="16"/>
      <rect x="733" y="192" width="16" height="16"/>
      <rect x="749" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  E — glyph 7, originX=795 ──────── -->
    <g fill="url(#pcb)">
      <!-- row 0: XXXXX -->
      <rect x="795" y="96"  width="16" height="16"/>
      <rect x="811" y="96"  width="16" height="16"/>
      <rect x="827" y="96"  width="16" height="16"/>
      <rect x="843" y="96"  width="16" height="16"/>
      <rect x="859" y="96"  width="16" height="16"/>
      <!-- rows 1-2: X.... -->
      <rect x="795" y="112" width="16" height="16"/>
      <rect x="795" y="128" width="16" height="16"/>
      <!-- row 3: XXXX. -->
      <rect x="795" y="144" width="16" height="16"/>
      <rect x="811" y="144" width="16" height="16"/>
      <rect x="827" y="144" width="16" height="16"/>
      <rect x="843" y="144" width="16" height="16"/>
      <!-- rows 4-5: X.... -->
      <rect x="795" y="160" width="16" height="16"/>
      <rect x="795" y="176" width="16" height="16"/>
      <!-- row 6: XXXXX -->
      <rect x="795" y="192" width="16" height="16"/>
      <rect x="811" y="192" width="16" height="16"/>
      <rect x="827" y="192" width="16" height="16"/>
      <rect x="843" y="192" width="16" height="16"/>
      <rect x="859" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  N — glyph 8, originX=889 ──────── -->
    <g fill="url(#pcb)">
      <!-- col 0: full height -->
      <rect x="889" y="96"  width="16" height="16"/>
      <rect x="889" y="112" width="16" height="16"/>
      <rect x="889" y="128" width="16" height="16"/>
      <rect x="889" y="144" width="16" height="16"/>
      <rect x="889" y="160" width="16" height="16"/>
      <rect x="889" y="176" width="16" height="16"/>
      <rect x="889" y="192" width="16" height="16"/>
      <!-- diagonal -->
      <rect x="905" y="112" width="16" height="16"/>
      <rect x="921" y="128" width="16" height="16"/>
      <rect x="937" y="144" width="16" height="16"/>
      <!-- col 4: full height -->
      <rect x="953" y="96"  width="16" height="16"/>
      <rect x="953" y="112" width="16" height="16"/>
      <rect x="953" y="128" width="16" height="16"/>
      <rect x="953" y="144" width="16" height="16"/>
      <rect x="953" y="160" width="16" height="16"/>
      <rect x="953" y="176" width="16" height="16"/>
      <rect x="953" y="192" width="16" height="16"/>
    </g>

    <!-- ────────  T — glyph 9, originX=983 ──────── -->
    <g fill="url(#pcb)">
      <rect x="983"  y="96"  width="16" height="16"/>
      <rect x="999"  y="96"  width="16" height="16"/>
      <rect x="1015" y="96"  width="16" height="16"/>
      <rect x="1031" y="96"  width="16" height="16"/>
      <rect x="1047" y="96"  width="16" height="16"/>
      <rect x="1015" y="112" width="16" height="16"/>
      <rect x="1015" y="128" width="16" height="16"/>
      <rect x="1015" y="144" width="16" height="16"/>
      <rect x="1015" y="160" width="16" height="16"/>
      <rect x="1015" y="176" width="16" height="16"/>
      <rect x="1015" y="192" width="16" height="16"/>
    </g>
  </g>

  <!-- AMBER UNDERLINE -->
  <rect x="240" y="232" width="720" height="3" fill="#a78b56" opacity="0.85"/>

  <!-- SIX-DOT COUNCIL MARKER (one per sovereign LLM) -->
  <g fill="#d99a2b">
    <circle cx="500" cy="252" r="6"/>
    <circle cx="540" cy="252" r="6"/>
    <circle cx="580" cy="252" r="6"/>
    <circle cx="620" cy="252" r="6"/>
    <circle cx="660" cy="252" r="6"/>
    <circle cx="700" cy="252" r="6"/>
  </g>

  <!-- STRAPLINE -->
  <text x="600" y="290" font-family="ui-monospace, 'JetBrains Mono', Menlo, 'Courier New', monospace" font-size="13" fill="#b08b4a" letter-spacing="6" text-anchor="middle">⁂  SIX  SOVEREIGN  LLMS  ·  ONE  AGENT  ·  ON-CHAIN  VERIFIABLE  ⁂</text>
</svg>
