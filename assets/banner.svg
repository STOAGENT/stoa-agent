<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff1b6"/>
      <stop offset="30%" stop-color="#f5c84e"/>
      <stop offset="65%" stop-color="#d18b1a"/>
      <stop offset="100%" stop-color="#7a3d00"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#b88121"/>
      <stop offset="60%" stop-color="#7e4e0a"/>
      <stop offset="100%" stop-color="#3a1d00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0707"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- LETTER PIXELS — STOA-AGENT, 10 glyphs × (5 cols × 7 rows), 18px per pixel,
       2px gap between glyphs. Outer "edge" pixels are darker (goldDark) for the
       chunky/circuit-board feel of the original; inner pixels are bright gold. -->

  <!-- Layout maths: glyph width = 5*18 = 90px, gap = 12px, glyph+gap = 102px.
       10 glyphs × 102 - last gap = 1020 - 12 = 1008 wide. Centered in 1200 →
       startX = (1200-1008)/2 = 96. startY = (320-126)/2 = 97. -->

  <g fill="url(#gold)">
    <!-- S — glyph 0, startX=96 -->
    <rect x="114" y="97"  width="72" height="18"/>
    <rect x="96"  y="97"  width="18" height="36"/>
    <rect x="96"  y="133" width="90" height="18"/>
    <rect x="168" y="151" width="18" height="36"/>
    <rect x="96"  y="187" width="90" height="18"/>
    <!-- T — glyph 1, startX=198 -->
    <rect x="198" y="97"  width="90" height="18"/>
    <rect x="234" y="115" width="18" height="108"/>
    <!-- O — glyph 2, startX=300 -->
    <rect x="318" y="97"  width="54" height="18"/>
    <rect x="300" y="115" width="18" height="90"/>
    <rect x="372" y="115" width="18" height="90"/>
    <rect x="318" y="205" width="54" height="18"/>
    <!-- A — glyph 3, startX=402 -->
    <rect x="420" y="97"  width="54" height="18"/>
    <rect x="402" y="115" width="18" height="108"/>
    <rect x="474" y="115" width="18" height="108"/>
    <rect x="420" y="151" width="54" height="18"/>
    <!-- "-" — glyph 4, startX=504 -->
    <rect x="504" y="151" width="90" height="18"/>
    <!-- A — glyph 5, startX=606 -->
    <rect x="624" y="97"  width="54" height="18"/>
    <rect x="606" y="115" width="18" height="108"/>
    <rect x="678" y="115" width="18" height="108"/>
    <rect x="624" y="151" width="54" height="18"/>
    <!-- G — glyph 6, startX=708 -->
    <rect x="726" y="97"  width="54" height="18"/>
    <rect x="708" y="115" width="18" height="90"/>
    <rect x="726" y="205" width="72" height="18"/>
    <rect x="780" y="151" width="18" height="54"/>
    <rect x="744" y="151" width="54" height="18"/>
    <!-- N — glyph 7, startX=810 -->
    <rect x="810" y="97"  width="18" height="126"/>
    <rect x="882" y="97"  width="18" height="126"/>
    <rect x="828" y="115" width="18" height="18"/>
    <rect x="846" y="133" width="18" height="18"/>
    <rect x="864" y="151" width="18" height="18"/>
    <!-- T — glyph 8, startX=912 -->
    <rect x="912" y="97"  width="90" height="18"/>
    <rect x="948" y="115" width="18" height="108"/>
  </g>

  <!-- DARK EDGE PIXELS — sit beneath the glyph fill, peek out as a 4px shadow on
       the bottom + right of each block. Creates the embossed retro feel. -->
  <g fill="url(#goldDark)">
    <!-- S edges -->
    <rect x="114" y="111" width="72" height="4"/>
    <rect x="182" y="97"  width="4"  height="36"/>
    <rect x="96"  y="147" width="90" height="4"/>
    <rect x="182" y="151" width="4"  height="36"/>
    <rect x="96"  y="201" width="90" height="4"/>
    <!-- T edges -->
    <rect x="198" y="111" width="90" height="4"/>
    <rect x="248" y="115" width="4"  height="108"/>
    <!-- O edges -->
    <rect x="318" y="111" width="54" height="4"/>
    <rect x="314" y="115" width="4"  height="90"/>
    <rect x="386" y="115" width="4"  height="90"/>
    <rect x="318" y="219" width="54" height="4"/>
    <!-- A edges -->
    <rect x="420" y="111" width="54" height="4"/>
    <rect x="416" y="115" width="4"  height="108"/>
    <rect x="488" y="115" width="4"  height="108"/>
    <rect x="420" y="165" width="54" height="4"/>
    <!-- "-" edge -->
    <rect x="504" y="165" width="90" height="4"/>
    <!-- A (right) edges -->
    <rect x="624" y="111" width="54" height="4"/>
    <rect x="620" y="115" width="4"  height="108"/>
    <rect x="692" y="115" width="4"  height="108"/>
    <rect x="624" y="165" width="54" height="4"/>
    <!-- G edges -->
    <rect x="726" y="111" width="54" height="4"/>
    <rect x="722" y="115" width="4"  height="90"/>
    <rect x="726" y="219" width="72" height="4"/>
    <rect x="794" y="151" width="4"  height="54"/>
    <rect x="744" y="165" width="54" height="4"/>
    <!-- N edges -->
    <rect x="824" y="97"  width="4"  height="126"/>
    <rect x="896" y="97"  width="4"  height="126"/>
    <rect x="842" y="115" width="4"  height="18"/>
    <rect x="860" y="133" width="4"  height="18"/>
    <rect x="878" y="151" width="4"  height="18"/>
    <!-- T (right) edges -->
    <rect x="912" y="111" width="90" height="4"/>
    <rect x="962" y="115" width="4"  height="108"/>
  </g>

  <!-- AMBER UNDERLINE + SIX-DOT COUNCIL MARKER -->
  <rect x="240" y="248" width="720" height="3" fill="#a78b56" opacity="0.85"/>
  <g fill="#d99a2b" opacity="0.95">
    <circle cx="500" cy="269" r="6"/>
    <circle cx="540" cy="269" r="6"/>
    <circle cx="580" cy="269" r="6"/>
    <circle cx="620" cy="269" r="6"/>
    <circle cx="660" cy="269" r="6"/>
    <circle cx="700" cy="269" r="6"/>
  </g>

  <!-- STRAPLINE -->
  <text x="600" y="302" font-family="ui-monospace, 'JetBrains Mono', Menlo, 'Courier New', monospace" font-size="13" fill="#b08b4a" letter-spacing="6" text-anchor="middle">⁂  SIX  SOVEREIGN  LLMS  ·  ONE  AGENT  ·  ON-CHAIN  VERIFIABLE  ⁂</text>
</svg>
